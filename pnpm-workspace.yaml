packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 : remplace `pnpm.onlyBuiltDependencies` de package.json (champ plus lu en v11).
# Seuls ces paquets ont le droit d'exécuter leurs scripts de build (postinstall…).
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
